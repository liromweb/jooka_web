<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Быстрая заметка</title><style>body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f7f7f9;color:#202022;display:grid;place-items:center;min-height:100vh;padding:18px;box-sizing:border-box}main{max-width:380px}h1{font-size:15px;margin:0 0 10px}blockquote{margin:0;padding:10px 12px;background:#fff;border-radius:12px;font-size:12px;line-height:1.5;color:#555a66;max-height:110px;overflow:hidden}small{color:#94949a}</style></head><body><main><h1 id="st">Сохраняю…</h1><blockquote id="quote" hidden></blockquote><p><small id="src"></small></p></main><script>
const q=new URLSearchParams(location.search),text=q.get('s')||'',url=q.get('u')||'',title=q.get('t')||'';
if(text){quote.hidden=false;quote.textContent=text.slice(0,300)}src.textContent=title;
fetch('/api/clip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,url,title})}).then(r=>{if(!r.ok)throw 0;st.textContent='Сохранено в жука ✓';setTimeout(()=>close(),1400)}).catch(()=>{st.textContent='Не сохранилось. Запущен ли сервер (python3 server.py)?'});
</script></body></html>
