<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="жука — личное пространство для лекций, чтения и собственных мыслей."><title>жука — твоя библиотека</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="rail"><a href="#" class="logo" aria-label="жука — главная">жука<span class="bug">✳</span></a><span class="domain">jooka.net</span><nav><button data-view="home" class="nav active">▦ <span>Библиотека</span></button><button data-view="inbox" class="nav">▱ <span>Входящие</span><small id="inboxCount"></small></button></nav><div class="rail-label">Коллекции <button id="folderAdd" aria-label="Создать коллекцию">＋</button></div><div id="folderNav"></div><div class="rail-bottom"><div class="avatar">Ю</div><div>Моё пространство<small>Дизайн-прототип</small></div></div></aside>
<main><header class="topbar"><span id="breadcrumb">Моё пространство</span><div class="top-actions"><button id="help" aria-label="О прототипе">ⓘ</button><button id="add" class="primary">＋ Добавить материал</button></div></header><section class="content"><div class="heading"><h1 id="heading">Библиотека</h1></div><div class="controls"><div class="segments"><button id="collectionsTab" class="chosen">Коллекции</button><button id="materialsTab">Все материалы</button></div><label class="search"><span>⌕</span><input id="search" placeholder="Найти что-нибудь…" aria-label="Поиск материалов"></label></div><div id="collectionGrid" class="collection-grid"></div><section id="materialSection"><div class="section-header"><h2 id="materialsHeading">Недавно добавленное</h2><span id="materialCount"></span></div><div id="materialGrid" class="material-grid"></div></section></section></main>
<dialog id="composer"><form id="composeForm"><div class="dialog-head"><span id="dialogLabel">Новый материал</span><button type="button" id="close" class="icon" aria-label="Закрыть">×</button></div><input id="title" class="title-input" placeholder="С чего начнём?" aria-label="Название материала" maxlength="200"><textarea id="body" placeholder="Мысль, цитата, конспект… Здесь можно просто писать." aria-label="Текст материала"></textarea><div id="recordPanel" class="record-panel" hidden><div class="record-dot"></div><div><strong>Здесь будет запись лекции</strong><p>В этой версии можно посмотреть интерфейс. Микрофон не включается.</p></div><button type="button" id="dismissRecord" aria-label="Убрать запись">×</button></div><div id="attachments"></div><label class="dropzone" id="dropzone"><input id="files" type="file" multiple hidden><span>＋ Прикрепить файлы</span><small>или перетащи сюда PDF, аудио, видео, заметки</small></label><div class="compose-tools"><button type="button" id="record">◉ Запись лекции</button><button type="button" id="link">↗ Добавить ссылку</button></div><div id="sourceWrap" hidden><input id="source" type="url" placeholder="https://…" aria-label="Ссылка на источник"></div><div class="dialog-bottom"><label>Сохранить в <select id="folder" aria-label="Коллекция"></select></label><button class="primary" type="submit">Сохранить материал</button></div><div id="composeStatus" role="status"></div></form></dialog>
<dialog id="collectionDialog"><form id="folderForm"><div class="dialog-head"><span>Новая коллекция</span><button type="button" id="closeFolder" class="icon" aria-label="Закрыть">×</button></div><input id="folderName" placeholder="Например, Медиатеория" aria-label="Название коллекции" required maxlength="80"><button class="primary" type="submit">Создать коллекцию</button></form></dialog><dialog id="moveDialog"><form id="moveForm"><div class="dialog-head"><span>Переместить</span><button type="button" id="closeMove" class="icon" aria-label="Закрыть">×</button></div><p id="moveTitle"></p><label class="move-label" for="moveFolder">Коллекция</label><select id="moveFolder"></select><button type="submit" class="primary">Переместить</button></form></dialog><div id="cardMenu" class="card-menu" role="menu" hidden></div><div id="toast" role="status"></div><script src="app.js" type="module"></script></body></html>
